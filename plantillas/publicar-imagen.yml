# Va en TU copia (fork) de OpenReply, en .github/workflows/publicar-imagen.yml.
#
# Construye la imagen en GitHub, gratis, y no en tu servidor: el Dockerfile hace
# `next build` y en un servidor pequeno se come toda la CPU durante minutos.
#
# Cada push a la rama `instalacion` publica ghcr.io/<tu-usuario>/openreply:sha-xxxxxxx.
# Sin `latest` a proposito: tu servidor apunta siempre a una version concreta y
# la cambias tu cuando quieras actualizar.
#
# Despues del primer build: GitHub -> tu perfil -> Packages -> openreply ->
# Package settings -> Change visibility -> Public. Asi tu servidor la descarga
# sin contrasena. La imagen no lleva ninguna clave: las claves van en el .env.

name: Publicar imagen (GHCR)

on:
  push:
    branches: [instalacion]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openreply
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
